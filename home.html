<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Earn Zone</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<!-- TOP HEADER -->

<div class="top-header">

<div class="profile-area">

<img src="logo.png">

<div>

<h2 id="username"></h2>we

<p>Welcome earn point🤑 </p>

</div>

</div>

<div class="balance-box">

৳ <span id="balance">0</span>

</div>

</div>

<!-- MENU -->

<div class="main-menu">

<div class="menu-box">

<i class="fa-solid fa-list-check"></i>

<p>Tasks</p>

</div>

<div class="menu-box">

<i class="fa-solid fa-wallet"></i>

<p>Withdraw</p>

</div>

<div class="menu-box">

<i class="fa-solid fa-user-group"></i>

<p>Referral</p>

</div>

</div>

<!-- TASK -->

<div class="card">

<h3>📋 Daily Tasks</h3>

<button class="task-btn fb"
onclick="addBalance()">

<i class="fa-brands fa-facebook"></i>

Facebook Follow +5 TK

</button>

<button class="task-btn tk">

<i class="fa-brands fa-tiktok"></i>

TikTok Follow +5 TK

</button>

<button class="task-btn yt">

<i class="fa-brands fa-youtube"></i>

YouTube Subscribe +5 TK

</button>

</div>

<!-- WITHDRAW -->

<div class="card">

<h3>💳 Withdraw Request</h3>

<select id="method">

<option>bKash</option>

<option>Nagad</option>

<option>Rocket</option>

</select>

<input type="text"
id="bkash"
placeholder="Enter Account Number">

<input type="number"
id="amount"
placeholder="Enter Withdraw Amount">

<button class="withdraw-btn"
onclick="withdraw()">

Send Withdraw Request

</button>

</div>

<!-- SUPPORT -->

<div class="card">

<h3>🛠 Support Center</h3>

<button class="support-btn">

<i class="fa-brands fa-telegram"></i>

Telegram Support

</button>

</div>

<!-- LOGOUT -->

<button class="logout"
onclick="logout()">

Logout

</button>

<!-- BOTTOM MENU -->

<div class="bottom-menu">

<div>

<i class="fa-solid fa-house active"></i>

<p>Home</p>

</div>

<div>

<i class="fa-solid fa-wallet"></i>

<p>Wallet</p>

</div>

<div>

<i class="fa-solid fa-user"></i>

<p>Profile</p>

</div>

</div>

<script type="module"
src="app.js"></script>

</body>
               </html>
