<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Earn Zone</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<!-- TOP HEADER -->

<div class="top-header">

<div class="profile-area">

<img src="logo.png"
style="width:60px;height:60px;border-radius:50%;">

<div>

<h2 id="username"></h2>

<p>Welcome Back 👋</p>

</div>

</div>

<div class="balance-box">

৳ <span id="balance">0</span>

</div>

</div>

<!-- MENU -->

<div class="main-menu">

<div class="menu-box">

<i class="fa-solid fa-list-check"></i>

<p>Tasks</p>

</div>

<div class="menu-box"
onclick="openWithdraw()">

<i class="fa-solid fa-wallet"></i>

<p>Withdraw</p>

</div>

<div class="menu-box">

<i class="fa-solid fa-user-group"></i>

<p>Referral</p>

</div>

</div>

<!-- TASK -->

<div class="card">

<h3>📋Tasks</h3>

<a href="https://www.facebook.com/profile.php?id=100095177704719"

target="_blank"

onclick="addBalance()">

<button class="task-btn fb">

<i class="fa-brands fa-facebook"></i>

Facebook Follow +5 TK

</button>

</a>

<a href="https://vm.tiktok.com/ZS9FGsVVfw7Mc-O5wY8/"

target="_blank"

onclick="addBalance()">

<button class="task-btn tk">

<i class="fa-brands fa-tiktok"></i>

TikTok Follow +5 TK

</button>

</a>

</div>

<!-- SUPPORT -->

<div class="card">

<h3>🛠 Support Center</h3>

<a href="https://t.me/+5PiZP-1R4-02Nzc1"

target="_blank">

<button class="support-btn">

<i class="fa-brands fa-telegram"></i>

Telegram Support

</button>

</a>

</div>

<!-- WITHDRAW POPUP -->

<div id="withdrawPopup"

style="

display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:999;
">

<div style="

background:white;
width:90%;
max-width:400px;
margin:80px auto;
padding:20px;
border-radius:25px;
">

<h2>💳 Withdraw</h2>

<select id="method"
style="width:100%;padding:12px;margin-top:10px;border-radius:10px;">

<option>bKash</option>
<option>Nagad</option>
<option>Rocket</option>

</select>

<input type="text"
id="bkash"
placeholder="Enter Number"

style="width:100%;padding:12px;margin-top:10px;border-radius:10px;">

<input type="number"
id="amount"
placeholder="Enter Amount"

style="width:100%;padding:12px;margin-top:10px;border-radius:10px;">

<button class="withdraw-btn"
onclick="withdraw()">

Send Request

</button>

<button class="logout"
onclick="closeWithdraw()">

Close

</button>

</div>

</div>

<!-- LOGOUT -->

<button class="logout"
onclick="logout()">

Logout

</button>

<!-- BOTTOM MENU -->

<div class="bottom-menu">

<div>

<i class="fa-solid fa-house active"></i>

<p>Home</p>

</div>

<div onclick="openWithdraw()">

<i class="fa-solid fa-wallet"></i>

<p>Wallet</p>

</div>

<div>

<i class="fa-solid fa-user"></i>

<p>Profile</p>

</div>

</div>

<script type="module"
src="app.js"></script>

</body>
  </html>
