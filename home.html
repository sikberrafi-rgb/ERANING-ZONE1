<!DOCTYPE html>
<html>
<head>
  <title>Earn App</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body style="margin:0;font-family:Arial;background:linear-gradient(135deg,#11c5a3,#0d6efd);">

<!-- HEADER -->
<div style="padding:25px;text-align:center;color:white;">
  <h1>💰 Earn App</h1>
  <p>Complete Task & Earn Money</p>
</div>

<!-- MAIN CARD -->
<div style="background:white;margin:10px;border-radius:25px;padding:15px;">

  <!-- GRID MENU -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;">

    <div style="background:#f5f5f5;padding:15px;border-radius:15px;">
      <i class="fa-solid fa-bullhorn" style="font-size:30px;color:#ff9800;"></i>
      <p>Ads</p>
    </div>

    <div style="background:#f5f5f5;padding:15px;border-radius:15px;">
      <i class="fa-solid fa-users" style="font-size:30px;color:#11c5a3;"></i>
      <p>Referral</p>
    </div>

    <div style="background:#f5f5f5;padding:15px;border-radius:15px;">
      <i class="fa-brands fa-facebook" style="font-size:30px;color:#1877f2;"></i>
      <p>Facebook Sell</p>
    </div>

    <div style="background:#f5f5f5;padding:15px;border-radius:15px;">
      <i class="fa-solid fa-envelope" style="font-size:30px;color:#ea4335;"></i>
      <p>Gmail Sell</p>
    </div>

    <div style="background:#f5f5f5;padding:15px;border-radius:15px;">
      <i class="fa-solid fa-list-check" style="font-size:30px;color:#4caf50;"></i>
      <p>Task</p>
    </div>

    <div style="background:#f5f5f5;padding:15px;border-radius:15px;">
      <i class="fa-solid fa-wallet" style="font-size:30px;color:#9c27b0;"></i>
      <p>Withdraw</p>
    </div>

  </div>

</div>

<!-- TASK -->
<div style="background:white;margin:10px;border-radius:25px;padding:15px;">

  <h3>📋 Daily Task</h3>

  <a href="https://www.facebook.com/profile.php?id=100095177704719" target="_blank">
    <button style="width:100%;padding:12px;margin:5px 0;background:#1877f2;color:white;border:none;border-radius:10px;">
      📘 Facebook Task
    </button>
  </a>

  <a href="https://vm.tiktok.com/ZS9F4TMLa3jA5-ET2oD/" target="_blank">
    <button style="width:100%;padding:12px;margin:5px 0;background:#000;color:white;border:none;border-radius:10px;">
      🎵 TikTok Task
    </button>
  </a>

  <p>💰 Reward: 2 TK</p>

</div>

<!-- REFERRAL -->
<div style="background:white;margin:10px;border-radius:25px;padding:15px;">

  <h3>🎁 Referral Link</h3>

  <input type="text" value="https://yourapp.com/ref=123"
  style="width:100%;padding:10px;text-align:center;border-radius:10px;border:1px solid #ccc;" readonly>

</div>

<!-- WITHDRAW -->
<div style="background:white;margin:10px;border-radius:25px;padding:15px;">

  <h3>💳 Withdraw</h3>

  <button style="width:100%;padding:10px;margin:5px 0;background:#e91e63;color:white;border:none;border-radius:10px;">
    bKash
  </button>

  <button style="width:100%;padding:10px;margin:5px 0;background:#ff5722;color:white;border:none;border-radius:10px;">
    Nagad
  </button>

  <button style="width:100%;padding:10px;margin:5px 0;background:#003087;color:white;border:none;border-radius:10px;">
    PayPal
  </button>

</div>

</body>
</html>
