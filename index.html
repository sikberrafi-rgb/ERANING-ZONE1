<!DOCTYPE html>
<html>
<head>
  <title>Earn Zone Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#11c5a3,#0d6efd);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .login-box{
      width:85%;
      background:white;
      padding:25px;
      border-radius:25px;
      text-align:center;
      box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    h1{
      color:#11c5a3;
      margin-bottom:25px;
    }

    input{
      width:100%;
      padding:14px;
      margin-top:12px;
      border:none;
      background:#f2f2f2;
      border-radius:12px;
      font-size:16px;
    }

    button{
      width:100%;
      padding:14px;
      margin-top:15px;
      border:none;
      border-radius:12px;
      background:#11c5a3;
      color:white;
      font-size:18px;
      font-weight:bold;
    }

    .signup{
      background:#0d6efd;
    }

  </style>
</head>

<body>

<div class="login-box">

  <h1>💰 Earn Zone</h1>

  <input type="email" id="email" placeholder="Enter Email">

  <input type="password" id="password" placeholder="Enter Password">

  <button onclick="login()">LOGIN</button>

  <button class="signup" onclick="signup()">CREATE ACCOUNT</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

  apiKey: "AIzaSyBw2LPnbQ_T4wQxAT-J2iWcJs0jYA3F0so",

  authDomain: "earnzone-39a95.firebaseapp.com",

  projectId: "earnzone-39a95",

  storageBucket: "earnzone-39a95.firebasestorage.app",

  messagingSenderId: "217879766538",

  appId: "1:217879766538:web:0cc3a449e387a97cbda1f3",

  measurementId: "G-LC9MGWYN1L"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.signup = function(){

let email = document.getElementById("email").value;

let password = document.getElementById("password").value;

createUserWithEmailAndPassword(auth,email,password)

.then(()=>{

alert("Account Created Successfully");

})

.catch((error)=>{

alert(error.message);

});

}

window.login = function(){

let email = document.getElementById("email").value;

let password = document.getElementById("password").value;

signInWithEmailAndPassword(auth,email,password)

.then(()=>{

alert("Login Success");

window.location.href="home.html";

})

.catch((error)=>{

alert(error.message);

});

}

</script>

</body>
</html>
