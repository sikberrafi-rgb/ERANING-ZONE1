<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earn Zone</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#f2f5f9;
    }

    /* HEADER */

    .header{
      background:linear-gradient(135deg,#11c5a3,#0d6efd);
      color:white;
      padding:25px;
      border-bottom-left-radius:30px;
      border-bottom-right-radius:30px;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .profile{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .profile img{
      width:50px;
      height:50px;
      border-radius:50%;
      border:3px solid white;
    }

    .balance{
      background:white;
      color:#11c5a3;
      padding:8px 15px;
      border-radius:20px;
      font-weight:bold;
    }

    /* MENU */

    .menu{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:12px;
      margin-top:20px;
    }

    .menu-box{
      background:white;
      padding:15px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
    }

    .menu-box i{
      font-size:28px;
      margin-bottom:8px;
    }

    .menu-box p{
      font-size:14px;
      font-weight:bold;
    }

    /* CARD */

    .card{
      background:white;
      margin:15px;
      padding:18px;
      border-radius:20px;
      box-shadow:0 4px 10px rgba(0,0,0,0.05);
    }

    .card h3{
      margin-bottom:15px;
      color:#333;
    }

    /* TASK BUTTON */

    .task-btn{
      width:100%;
      border:none;
      padding:14px;
      margin-top:10px;
      border-radius:12px;
      color:white;
      font-size:16px;
      font-weight:bold;
    }

    .fb{
      background:#1877f2;
    }

    .tk{
      background:black;
    }

    /* WITHDRAW */

    .withdraw button{
      width:100%;
      border:none;
      padding:13px;
      margin-top:10px;
      border-radius:12px;
      color:white;
      font-size:16px;
      font-weight:bold;
    }

    .bkash{
      background:#e2136e;
    }

    .nagad{
      background:#ff6600;
    }

    .paypal{
      background:#003087;
    }

    /* FOOTER */

    .footer{
      text-align:center;
      padding:20px;
      color:gray;
      font-size:14px;
    }

  </style>
</head>

<body>

  <!-- HEADER -->

  <div class="header">

    <div class="top">

      <div class="profile">
        <img src="https://i.ibb.co/4pDNDk1/avatar.png">
        <div>
          <h3>Rafi</h3>
          <p>Welcome Back 👋</p>
        </div>
      </div>

      <div class="balance">
        ৳ 120
      </div>

    </div>

    <!-- MENU -->

    <div class="menu">

      <div class="menu-box">
        <i class="fa-solid fa-bullhorn" style="color:#ff9800;"></i>
        <p>Ads</p>
      </div>

      <div class="menu-box">
        <i class="fa-solid fa-user-group" style="color:#11c5a3;"></i>
        <p>Refer</p>
      </div>

      <div class="menu-box">
        <i class="fa-brands fa-facebook" style="color:#1877f2;"></i>
        <p>FB Sell</p>
      </div>

      <div class="menu-box">
        <i class="fa-solid fa-envelope" style="color:#ea4335;"></i>
        <p>Gmail Sell</p>
      </div>

      <div class="menu-box">
        <i class="fa-solid fa-list-check" style="color:#4caf50;"></i>
        <p>Task</p>
      </div>

      <div class="menu-box">
        <i class="fa-solid fa-wallet" style="color:#9c27b0;"></i>
        <p>Withdraw</p>
      </div>

    </div>

  </div>

  <!-- TASK -->

  <div class="card">

    <h3>📋 Daily Task</h3>

    <a href="https://www.facebook.com/profile.php?id=100095177704719">
      <button class="task-btn fb">
        Facebook Task Complete
      </button>
    </a>

    <a href="https://vm.tiktok.com/ZS9F4TMLa3jA5-ET2oD/">
      <button class="task-btn tk">
        TikTok Task Complete
      </button>
    </a>

    <p style="margin-top:12px;font-weight:bold;color:#11c5a3;">
      Reward: 2 TK
    </p>

  </div>

  <!-- REFERRAL -->

  <div class="card">

    <h3>🎁 Referral Link</h3>

    <input type="text"
    value="https://earnzone/ref123"
    style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;">

  </div>

  <!-- WITHDRAW -->

  <div class="card withdraw">

    <h3>💳 Withdraw Method</h3>

    <button class="bkash">bKash</button>

    <button class="nagad">Nagad</button>

    <button class="paypal">PayPal</button>

  </div>

  <!-- SUPPORT -->

  <div class="card">

    <h3>🛠 Admin Support</h3>

    <a href="https://t.me/yourtelegram">
      <button class="task-btn" style="background:#229ED9;">
        Contact Telegram
      </button>
    </a>

  </div>

  <!-- FOOTER -->

  <div class="footer">
    © 2026 Earn Zone - All Rights Reserved
  </div>

</body>
  </html>
